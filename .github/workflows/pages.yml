# Genera las fichas de producto y el sitemap a partir de products.js y
# publica el sitio en GitHub Pages.
#
# Requiere que en Settings > Pages el Source este puesto en "GitHub Actions".
# Con eso, agregar un producto es solo editar products.js: las fichas
# producto/<slug>/ y el sitemap se rehacen solos en cada push.

name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar fichas de producto y sitemap
        run: node tools/build-productos.js

      - name: Armar la carpeta a publicar
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tools' \
            --exclude='_site' \
            ./ _site/
          echo "archivos a publicar: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
